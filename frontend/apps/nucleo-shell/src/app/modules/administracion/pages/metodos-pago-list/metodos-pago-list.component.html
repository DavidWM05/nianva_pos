<div class="metodos-pago-list">
  <div class="metodos-pago-list__header">
    <h1>Métodos de pago</h1>
    @if (permisos().crear) {
      <a routerLink="/metodos-pago/nuevo"><p-button label="Nuevo método de pago" icon="pi pi-plus" /></a>
    }
  </div>

  <input
    pInputText
    type="text"
    placeholder="Buscar por nombre..."
    class="metodos-pago-list__buscar"
    (input)="onBuscarInput($any($event.target).value)"
  />

  <nucleo-data-table
    [columns]="columns"
    [value]="metodosPago()"
    [totalRecords]="total()"
    [loading]="loading()"
    [virtualScroll]="false"
    emptyMessage="No hay métodos de pago que coincidan con la búsqueda."
    (lazyLoad)="onLazyLoad($event)"
  >
    <ng-template nucleoDataTableCell="tipo" let-row>
      {{ etiquetaTipo(row) }}
    </ng-template>

    <ng-template nucleoDataTableCell="incluir_en_financiero" let-row>
      {{ row.incluir_en_financiero ? 'Sí' : 'No' }}
    </ng-template>

    <ng-template nucleoDataTableCell="activo" let-row>
      <nucleo-status-badge
        [value]="row.activo ? 'activo' : 'inactivo'"
        [colorMap]="{ activo: 'success', inactivo: 'neutral' }"
      />
      @if (row.es_global) {
        <nucleo-status-badge value="global" [colorMap]="{ global: 'info' }" />
      }
    </ng-template>

    <ng-template nucleoDataTableCell="acciones" let-row>
      <div class="metodos-pago-list__acciones">
        @if (permisos().editar) {
          <p-button icon="pi pi-pencil" [text]="true" size="small" aria-label="Editar" (click)="irADetalle(row)" />
        }
        @if (permisos().eliminar && !row.es_global) {
          <p-button
            icon="pi pi-ban"
            severity="danger"
            [text]="true"
            size="small"
            aria-label="Desactivar"
            (click)="onDesactivar(row)"
          />
        }
      </div>
    </ng-template>
  </nucleo-data-table>
</div>
