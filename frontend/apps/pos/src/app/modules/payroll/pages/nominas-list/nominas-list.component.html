<div class="nominas-list">
  <div class="nominas-list__header">
    <h1>Nóminas</h1>
    @if (permisos().crear) {
      <button matButton="text" type="button" (click)="abrirGenerar()">
        Generar nómina
      </button>
    }
  </div>

  <ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
    ><ui-tabla
      [columnas]="columns"
      [filas]="filas()"
      [meta]="meta"
      [cargando]="loading()"
      (accion)="onAccion($event.fila, $event.accion)"
      mensajeVacio="No hay nóminas generadas."
      (cambio)="onCambio($event)"
  /></ui-page>
</div>

<ui-modal
  titulo="Generar nómina"
  [visible]="mostrarGenerar()"
  (visibleChange)="cerrarGenerar()"
>
  <ui-campo #campo50l3 etiqueta="Periodo — inicio">
    <input
      [id]="campo50l3.controlId() ?? 'nominas-list-campo50l3'"
      matInput
      [matDatepicker]="fecha50l1"
      [ngModel]="periodoInicio()"
      (ngModelChange)="periodoInicio.set($event)"
    /><mat-datepicker-toggle [for]="fecha50l1" /><mat-datepicker #fecha50l1 />
  </ui-campo>
  <ui-campo #campo50l4 etiqueta="Periodo — fin">
    <input
      [id]="campo50l4.controlId() ?? 'nominas-list-campo50l4'"
      matInput
      [matDatepicker]="fecha50l2"
      [ngModel]="periodoFin()"
      (ngModelChange)="periodoFin.set($event)"
    /><mat-datepicker-toggle [for]="fecha50l2" /><mat-datepicker #fecha50l2 />
  </ui-campo>
  <ui-btn-enviar
    etiqueta="Generar"
    [enviando]="generando()"
    [deshabilitado]="!periodoInicio() || !periodoFin()"
    (click)="confirmarGenerar()"
  />
</ui-modal>
