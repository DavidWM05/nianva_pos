<div class="empleados-list">
  <div class="empleados-list__header">
    <h1>Empleados</h1>
    @if (permisos().crear) {
      <ui-btn-crear objeto="empleado" (crear)="abrirFormulario()" />
    }
  </div>

  <ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
    ><ui-tabla
      [columnas]="columns"
      [filas]="filas()"
      [meta]="meta"
      [cargando]="loading()"
      [filaInactiva]="filaInactiva"
      (accion)="onAccion($event.fila, $event.accion)"
      mensajeVacio="No hay empleados registrados."
      (cambio)="onCambio($event)"
  /></ui-page>
</div>

<ui-modal
  titulo="Nuevo empleado"
  [visible]="mostrarFormulario()"
  (visibleChange)="cerrarFormulario()"
>
  <div class="empleados-list__campo">
    <nucleo-entidad-selector
      [buscador]="buscadorUsuario"
      label="Usuario"
      placeholder="Buscar usuario por nombre..."
      [valorInicial]="usuarioId()"
      (seleccionado)="usuarioId.set($event)"
    />
  </div>
  <ui-campo #campo50l2 etiqueta="Salario base">
    <ui-input-dinero
      [min]="0"
      [ngModel]="salarioBase()"
      (ngModelChange)="salarioBase.set($event)"
    />
  </ui-campo>
  <ui-campo #campo50l3 etiqueta="Tipo de salario">
    <ui-select-filtro
      [todas]="false"
      ariaLabel="Tipo de salario"
      [opciones]="tiposSalario"
      [ngModel]="tipoSalario()"
      (ngModelChange)="tipoSalario.set($event)"
    />
  </ui-campo>
  <ui-campo #campo50l4 etiqueta="Fecha de ingreso (opcional)">
    <input
      [id]="campo50l4.controlId() ?? 'empleados-list-campo50l4'"
      matInput
      [matDatepicker]="fecha50l1"
      [ngModel]="fechaIngreso()"
      (ngModelChange)="fechaIngreso.set($event)"
    /><mat-datepicker-toggle [for]="fecha50l1" /><mat-datepicker #fecha50l1 />
  </ui-campo>
  <ui-campo #campo50l5 etiqueta="Número de seguridad social (opcional)">
    <input
      matInput
      type="text"
      [id]="campo50l5.controlId() ?? 'empleados-list-campo50l5'"
      maxlength="30"
      [ngModel]="numeroSeguridadSocial()"
      (ngModelChange)="numeroSeguridadSocial.set($event)"
    />
  </ui-campo>
  <ui-btn-enviar
    etiqueta="Registrar empleado"
    [enviando]="guardando()"
    [deshabilitado]="usuarioId() === null"
    (click)="guardar()"
  />
</ui-modal>
