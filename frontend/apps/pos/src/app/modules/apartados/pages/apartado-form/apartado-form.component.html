<ui-page-header clave="apartados" subtitulo="Nuevo apartado" />
<ui-page estado="listo" forma="formulario">
<div>
  <div>
    <h2>Nuevo apartado</h2>
    <a routerLink="/apartados">Volver a la lista</a>
  </div>

  <ui-section titulo="Cliente">
    <nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre..."
      [valorInicial]="clienteId()"
      (seleccionado)="clienteId.set($event)"
    />
  </ui-section>

  <ui-section titulo="Resumen">
    <nucleo-lineas-producto (cambio)="onLineasCambio($event)" />
  </ui-section>

  <ui-section titulo="Resumen">
    <p>Total: {{ subtotal() | dinero }}</p>
  </ui-section>

  <ui-section titulo="Detalles">
    <ui-campo #campo1 etiqueta="Fecha de vencimiento (opcional)"><input matInput [matDatepicker]="vencimiento" [id]="campo1.controlId() ?? 'apartado-fecha-vencimiento'" [ngModel]="fechaVencimiento()" (ngModelChange)="fechaVencimiento.set($event)" /><mat-datepicker-toggle [for]="vencimiento" /><mat-datepicker #vencimiento /></ui-campo>
    <ui-campo #campo2 etiqueta="Notas (opcional)">
      <textarea [id]="campo2.controlId()" rows="2" [ngModel]="notas()" (ngModelChange)="notas.set($event)"></textarea>
    </ui-campo>
  </ui-section>

  <ui-form-actions><ui-btn-enviar [deshabilitado]="clienteId() === null || itemsActuales().length === 0" etiqueta="Crear apartado" [enviando]="guardando()" (click)="crearApartado()" /></ui-form-actions>
</div>

</ui-page>
