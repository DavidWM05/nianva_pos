<ui-page-header clave="apartados">@if (permisos().crear) { <ui-btn-crear acciones objeto="apartado" genero="m" ruta="/apartados/nuevo" /> }</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar [meta]="meta()"><ui-campo #buscador etiqueta="Buscar por cliente"><input type="search" [id]="buscador.controlId()" placeholder="Buscar por cliente..." [value]="busqueda()" (input)="onBuscarInput($any($event.target).value)" /></ui-campo></ui-filter-bar>
  <ui-tabla [columnas]="columnas" [filas]="filas()" [meta]="meta()" [cargando]="loading()" mensajeVacio="No hay apartados registrados todavía." (cambio)="onCambio($event)" (accion)="verFila($event.fila)" />
</ui-page>
