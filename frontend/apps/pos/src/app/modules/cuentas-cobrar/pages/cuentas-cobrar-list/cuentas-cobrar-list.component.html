<ui-page-header clave="cuentas-cobrar"></ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #busqueda etiqueta="Buscar por cliente"
      ><input
        type="text"
        placeholder="Buscar por cliente..."
        [ngModel]="clienteFiltro()"
        (ngModelChange)="onClienteInput($event)"
        [id]="busqueda.controlId()"
    /></ui-campo>
    <ui-campo etiqueta="Estado"
      ><ui-select-filtro
        [opciones]="estados"
        placeholder="Estado"
        [ngModel]="estadoFiltro()"
        (ngModelChange)="onEstadoCambio($event)"
        ariaLabel="Estado"
    /></ui-campo>
    <mat-checkbox
      [ngModel]="soloVencidas()"
      (ngModelChange)="onVencidasCambio($event)"
      >Solo vencidas</mat-checkbox
    >
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay cuentas por cobrar que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="irADetalle($event.fila)"
  />
</ui-page>
