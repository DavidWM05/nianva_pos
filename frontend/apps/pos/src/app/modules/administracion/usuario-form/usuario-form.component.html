<nucleo-dynamic-form [fields]="fields" [submitLabel]="submitLabel" [readonly]="readonly" (formSubmit)="onSubmit($event)">
  <!-- Proyectados: mismas clases y atributos que los campos propios de dynamic-form. -->
  <div class="dynamic-form__field">
    <label id="usuario-sucursal-etiqueta" for="usuario-sucursal">Sucursal</label>
    <mat-form-field class="dynamic-form__material" appearance="outline" subscriptSizing="dynamic">
      <mat-select
        id="usuario-sucursal"
        aria-labelledby="usuario-sucursal-etiqueta"
        [value]="sucursalId()"
        [disabled]="readonly"
        [canSelectNullableOptions]="true"
        (selectionChange)="sucursalId.set($event.value)"
      >
        <mat-option [value]="null">Sin sucursal asignada</mat-option>
        @for (sucursal of sucursales(); track sucursal.id) {
          <mat-option [value]="sucursal.id">{{ sucursal.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="dynamic-form__field">
    <!-- Obligatorio: mismo marcador que los campos propios de dynamic-form. El nombre accesible
         sale solo del span "Roles", sin el asterisco. -->
    <label for="usuario-roles"
      ><span id="usuario-roles-etiqueta">Roles</span>
      <span class="dynamic-form__required" aria-hidden="true">*</span></label
    >
    <mat-form-field class="dynamic-form__material" appearance="outline" subscriptSizing="dynamic">
      <mat-select
        id="usuario-roles"
        aria-labelledby="usuario-roles-etiqueta"
        placeholder="Selecciona uno o más roles"
        [multiple]="true"
        [required]="true"
        [formControl]="rolesControl"
        [attr.aria-describedby]="errorRoles() ? 'usuario-roles-error' : null"
      >
        @for (rol of roles(); track rol.id) {
          <mat-option [value]="rol.id">{{ rol.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if (errorRoles(); as error) {
      <small id="usuario-roles-error" class="dynamic-form__error" role="alert">{{ error }}</small>
    }
  </div>
</nucleo-dynamic-form>
