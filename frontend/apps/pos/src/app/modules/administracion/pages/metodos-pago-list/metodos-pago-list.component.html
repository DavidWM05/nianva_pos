<ui-page-header clave="metodos-pago" subtitulo="Formas de cobro disponibles en la venta">
  @if (permisos().crear) {
    <a acciones matButton="filled" routerLink="/metodos-pago/nuevo">
      <i class="pi pi-plus" matButtonIcon aria-hidden="true"></i>
      Nuevo método de pago
    </a>
  }
</ui-page-header>

<ui-page [estado]="estadoPagina()" forma="listado">
  <ui-filter-bar [meta]="meta()" [hayFiltros]="hayFiltros()" (limpiar)="limpiarFiltros()">
    <ui-campo etiqueta="Buscar">
      <input
        type="search"
        aria-label="Buscar por nombre"
        placeholder="Buscar por nombre..."
        [ngModel]="busqueda()"
        (ngModelChange)="onBuscarInput($event)"
      />
    </ui-campo>
  </ui-filter-bar>

  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay métodos de pago que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
  />
</ui-page>
