<nucleo-dynamic-form [fields]="fields" [submitLabel]="submitLabel" [readonly]="readonly" (formSubmit)="onSubmit($event)">
  <ui-checklist-agrupado
    etiqueta="Permisos"
    etiquetaFiltro="Filtrar permisos"
    placeholderFiltro="Módulo o permiso..."
    [grupos]="gruposChecklist()"
    [ngModel]="permisosIds()"
    [disabled]="readonly"
    (ngModelChange)="alCambiarPermisos($event)"
  />
</nucleo-dynamic-form>
