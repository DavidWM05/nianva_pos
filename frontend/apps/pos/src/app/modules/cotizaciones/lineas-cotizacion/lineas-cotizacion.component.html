<ui-section titulo="Agregar producto">
  <nucleo-entidad-selector [buscador]="buscadorProducto" [buscadorHijos]="buscadorVarianteDeProducto" label="Producto" labelHijos="Variante" placeholder="Buscar producto por nombre..." [valorInicial]="productoSeleccionadoId()" (seleccionado)="onProductoSeleccionado($event)" (hijoSeleccionado)="onVarianteSeleccionada($event)" />
  <ui-campo etiqueta="Cantidad a agregar"><ui-input-cantidad [decimales]="0" [ngModel]="cantidadNueva()" (ngModelChange)="cantidadNueva.set($event)" /></ui-campo>
  <ui-form-actions><button matButton="filled" type="button" [disabled]="varianteSeleccionadaId() === null || sugiriendoPrecio()" [attr.aria-busy]="sugiriendoPrecio()" (click)="agregarLinea()">@if (indicadorPrecio()) { <mat-spinner diameter="18" /> } Agregar línea</button></ui-form-actions>
</ui-section>
<ui-section titulo="Líneas">
  @if (lineas().length === 0) { <ui-empty mensaje="Todavía no hay líneas." /> }
  @for (grupo of gruposLineas.controls; track grupo; let indice = $index) {
    @let linea = lineas()[indice];
    <ui-section [titulo]="'Línea ' + (indice + 1) + ': ' + linea.etiqueta">
      <div class="campos-linea" [class.campos-linea--angosta]="pantalla.angosta()">
        <ui-campo [etiqueta]="'Cantidad, línea ' + (indice + 1) + ': ' + linea.etiqueta" [requerido]="true"><ui-input-cantidad [formControl]="grupo.controls.cantidad" [decimales]="0" /></ui-campo>
        <ui-campo [etiqueta]="'Precio unitario, línea ' + (indice + 1) + ': ' + linea.etiqueta" [requerido]="true"><ui-input-dinero [formControl]="grupo.controls.precio_unitario" [min]="0" /></ui-campo>
        <ui-campo [etiqueta]="'Descuento, línea ' + (indice + 1) + ': ' + linea.etiqueta" [requerido]="true"><ui-input-dinero [formControl]="grupo.controls.descuento" [min]="0" /></ui-campo>
      </div>
      <p>Subtotal: {{ linea.cantidad * linea.precio_unitario - linea.descuento | dinero }}</p>
      <ui-form-actions><button matButton="text" type="button" [attr.aria-label]="'Quitar línea ' + (indice + 1) + ': ' + linea.etiqueta" (click)="quitarLinea(indice)">Quitar</button></ui-form-actions>
    </ui-section>
  }
</ui-section>
