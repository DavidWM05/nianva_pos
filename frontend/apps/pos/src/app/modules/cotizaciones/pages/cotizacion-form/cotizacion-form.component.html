<ui-page-header clave="cotizaciones" subtitulo="Crear o editar cotización" />
<div>
  <h2>{{ editando() ? 'Editar cotización' : 'Nueva cotización' }}</h2>

  <ui-page [estado]="cargando() ? 'cargando' : errorCarga() ? 'error' : 'listo'" forma="formulario" (reintentar)="ngOnInit()">
    <ui-section titulo="Cliente">
      <nucleo-entidad-selector
        [buscador]="buscadorCliente"
        label="Cliente (opcional)"
        placeholder="Buscar cliente por nombre..."
        [valorInicial]="clienteId()"
        (seleccionado)="clienteId.set($event)"
      />
    </ui-section>

    <ui-section titulo="Resumen">
      <nucleo-lineas-cotizacion
        [valorInicial]="cotizacionActual()?.detalles ?? null"
        [precioManual]="precioManual()"
        (cambio)="onLineasCambio($event)"
      />
    </ui-section>

    <ui-section titulo="Resumen">
      <p>Subtotal: {{ subtotal() | dinero }}</p>
      <ui-campo #campo1 etiqueta="Descuento global"><ui-input-dinero [min]="0" [ngModel]="descuentoGlobal()" (ngModelChange)="descuentoGlobal.set($event)" /></ui-campo>
      <p>Total: {{ total() | dinero }}</p>
    </ui-section>

    <ui-section titulo="Configuración">
      <ui-campo #campo2 etiqueta="Días de validez">
        <input
          type="number"
          [id]="campo2.controlId()"
          min="1"
          max="365"
          [ngModel]="validezDias()"
          (ngModelChange)="validezDias.set($event)"
        />
      </ui-campo>
      <ui-campo #campo3 etiqueta="Uso CFDI (opcional)">
        <input
          type="text"
          [id]="campo3.controlId()"
          maxlength="10"
          [ngModel]="usoCfdi()"
          (ngModelChange)="usoCfdi.set($event)"
        />
      </ui-campo>
      <ui-campo #campo4 etiqueta="Observaciones">
        <textarea
          [id]="campo4.controlId()"
          rows="3"
          [ngModel]="observaciones()"
          (ngModelChange)="observaciones.set($event)"
        ></textarea>
      </ui-campo>
    </ui-section>

    <div>
      <ui-form-actions><fieldset class="acciones-envio" [disabled]="items().length === 0 || lineasInvalidas()"><ui-btn-enviar etiqueta="Guardar cotización" [enviando]="guardando()" (click)="guardar()" /></fieldset></ui-form-actions>
      <a matButton="text" routerLink="/cotizaciones">Cancelar</a>
    </div>
  </ui-page>
</div>
