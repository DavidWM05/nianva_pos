<ui-page-header clave="cotizaciones">@if (permisos().crear) { <ui-btn-crear acciones objeto="cotización" genero="f" ruta="/cotizaciones/crear" /> }</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar [meta]="meta()"><ui-campo #buscador etiqueta="Buscar por número"><input type="search" [id]="buscador.controlId()" placeholder="Buscar por número..." [value]="busqueda()" (input)="onBuscarInput($any($event.target).value)" /></ui-campo><ui-campo etiqueta="Estado"><ui-select-filtro [opciones]="estados" [ngModel]="estadoFiltro()" (ngModelChange)="onEstadoCambio($event)" /></ui-campo></ui-filter-bar>
  <ui-tabla [columnas]="columnas" [filas]="filas()" [meta]="meta()" [cargando]="loading()" mensajeVacio="No hay cotizaciones que coincidan con la búsqueda." (cambio)="onCambio($event)" (accion)="verFila($event.fila)" />
</ui-page>
