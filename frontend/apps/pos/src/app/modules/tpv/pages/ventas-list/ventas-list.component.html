<div class="ventas-list">
  <div class="ventas-list__header">
    <h2>Ventas</h2>
  </div>

  <ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
    <ui-filter-bar [meta]="meta()">
      <ui-campo #buscador etiqueta="Buscar por cliente">
        <input
          type="search"
          [id]="buscador.controlId()"
          placeholder="Buscar por cliente..."
          [ngModel]="busquedaTexto()"
          (ngModelChange)="onBuscarInput($event)"
        />
      </ui-campo>
    </ui-filter-bar>
    <ui-tabla
      [columnas]="columnas"
      [filas]="filas()"
      [meta]="meta()"
      [cargando]="loading()"
      mensajeVacio="No hay ventas registradas todavía."
      (cambio)="onCambio($event)"
      (accion)="alAccion($event.fila, $event.accion)"
    />
  </ui-page>
</div>

<ui-modal titulo="Anular venta" [visible]="ventaEnAnulacion() !== null" (visibleChange)="cerrarAnulacion()">
  <p>¿Anular la venta #{{ ventaEnAnulacion()?.id }}? Esta acción no se puede deshacer.</p>
  <ui-campo #motivo etiqueta="Motivo">
    <textarea
      [id]="motivo.controlId()"
      rows="3"
      maxlength="255"
      [ngModel]="motivoAnulacion()"
      (ngModelChange)="motivoAnulacion.set($event)"
    ></textarea>
  </ui-campo>
  <ui-form-actions acciones>
    <ui-btn-enviar
      etiqueta="Confirmar anulación"
      [enviando]="anulando()"
      [deshabilitado]="!motivoAnulacion().trim()"
      (click)="confirmarAnulacion()"
    />
  </ui-form-actions>
</ui-modal>
