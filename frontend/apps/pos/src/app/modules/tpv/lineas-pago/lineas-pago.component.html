<div class="lineas-pago">
  @for (pago of pagos(); track $index) {
    <div class="lineas-pago__linea">
      <p-select
        [options]="metodosPago()"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Método de pago"
        [ngModel]="pago.metodo_pago_id"
        (ngModelChange)="actualizarMetodoPago($index, $event)"
      />
      <input
        pInputText
        type="number"
        min="0"
        step="0.01"
        placeholder="Monto"
        [ngModel]="pago.monto"
        (ngModelChange)="actualizarMontoPago($index, $event)"
      />
      @if (pagos().length > 1) {
        <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" aria-label="Quitar pago" (click)="quitarLineaPago($index)" />
      }
    </div>
  }
  <p-button label="Agregar método de pago" icon="pi pi-plus" [text]="true" size="small" (click)="agregarLineaPago()" />

  <p class="lineas-pago__suma" [class.lineas-pago__suma--ok]="pagoCuadra()">
    Pagado: ${{ sumaPagos() }} de ${{ montoObjetivo }}
  </p>
</div>
