<ui-page-header clave="unidades-medida" subtitulo="Catálogo transversal de unidades">
  <ui-btn-crear acciones objeto="unidad" genero="f" (crear)="abrirNueva()" />
</ui-page-header>

<ui-page [estado]="estadoPagina()" forma="listado" (reintentar)="cargar()">
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="metaListado()"
    [cargando]="cargando()"
    [filaInactiva]="esInactiva"
    mensajeVacio="Todavía no hay unidades de medida registradas."
    (accion)="onAccionVista($event.fila, $event.accion)"
  />
</ui-page>

<ui-modal
  [visible]="mostrarFormulario()"
  (visibleChange)="mostrarFormulario.set($event)"
  [titulo]="unidadEnEdicion() ? 'Editar unidad de medida' : 'Nueva unidad de medida'"
  tamano="sm"
>
  <ui-campo etiqueta="Nombre" [requerido]="true">
    <input type="text" aria-label="Nombre" maxlength="50" [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" />
  </ui-campo>
  <ui-campo etiqueta="Abreviatura" [requerido]="true">
    <input type="text" aria-label="Abreviatura" maxlength="10" [ngModel]="abreviatura()" (ngModelChange)="abreviatura.set($event)" />
  </ui-campo>
  <ui-campo etiqueta="Tipo" [requerido]="true">
    <ui-select-filtro [opciones]="tipos" [ngModel]="tipo()" ariaLabel="Tipo" (ngModelChange)="tipo.set($event)" />
  </ui-campo>
  @if (unidadEnEdicion()) {
    <mat-checkbox [checked]="activo()" (change)="activo.set($event.checked)">Activa</mat-checkbox>
  }
  <button acciones matButton="text" type="button" (click)="cerrarFormulario()">Cancelar</button>
  <ui-btn-enviar
    acciones
    etiqueta="Guardar"
    [enviando]="guardando()"
    (click)="guardar()"
  />
</ui-modal>
