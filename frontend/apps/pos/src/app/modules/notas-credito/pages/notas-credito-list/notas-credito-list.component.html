<ui-page-header clave="notas-credito"></ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
  >
    <nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre..."
      [valorInicial]="clienteFiltroId()"
      (seleccionado)="onClienteSeleccionado($event)"
    />
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay notas de crédito que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="irADetalle($event.fila)"
  />
</ui-page>
