<ui-page-header clave="crm">
  @if (permisos().crear) {
    <ui-btn-crear acciones objeto="cliente" ruta="/crm/clientes/nuevo" />
  }
</ui-page-header>
<ui-page [estado]="estadoPagina()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="busqueda().trim() !== ''"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #campoBuscar etiqueta="Buscar">
      <input
        class="clientes-list__buscar"
        [id]="campoBuscar.controlId()"
        #buscar
        type="search"
        placeholder="Buscar por nombre..."
        [ngModel]="busqueda()"
        (ngModelChange)="onBuscarInput($event)"
      />
    </ui-campo>
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    [filaInactiva]="esInactiva"
    mensajeVacio="No hay clientes que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
  />
</ui-page>
