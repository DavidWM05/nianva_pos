<ui-page-header clave="crm-campanas" subtitulo="Nueva campaña" />
<ui-page estado="listo" forma="formulario">
  @if (ultimaEnviada(); as campana) {
    <ui-alert tono="exito"
      >Campaña "{{ campana.asunto }}" enviada a
      {{ campana.destinatarios | cantidad: 'clientes' }}.</ui-alert
    >
  }
  <ui-section titulo="Nueva campaña">
    <form (ngSubmit)="enviar()">
      <ui-campo etiqueta="Segmento de clientes" [requerido]="true">
        <ui-select-filtro
          name="segmento"
          [todas]="false"
          [opciones]="segmentos"
          [ngModelOptions]="{ standalone: true }"
          [ngModel]="segmento()"
          (ngModelChange)="segmento.set($event)"
        />
      </ui-campo>
      <ui-campo #campoAsunto etiqueta="Asunto" [requerido]="true">
        <input
          name="asunto"
          [id]="campoAsunto.controlId()"
          [attr.aria-invalid]="campoAsunto.invalido()"
          [attr.aria-describedby]="
            campoAsunto.mensaje() ? campoAsunto.errorId() : null
          "
          type="text"
          maxlength="200"
          required
          [ngModelOptions]="{ standalone: true }"
          [ngModel]="asunto()"
          (ngModelChange)="asunto.set($event)"
        />
      </ui-campo>
      <ui-campo #campoMensaje etiqueta="Mensaje" [requerido]="true">
        <textarea
          name="mensaje"
          [id]="campoMensaje.controlId()"
          [attr.aria-invalid]="campoMensaje.invalido()"
          [attr.aria-describedby]="
            campoMensaje.mensaje() ? campoMensaje.errorId() : null
          "
          rows="5"
          maxlength="5000"
          required
          [ngModelOptions]="{ standalone: true }"
          [ngModel]="mensaje()"
          (ngModelChange)="mensaje.set($event)"
        ></textarea>
      </ui-campo>
      <ui-form-actions
        ><ui-btn-enviar etiqueta="Enviar campaña" [enviando]="enviando()"
      /></ui-form-actions>
    </form>
  </ui-section>
</ui-page>
