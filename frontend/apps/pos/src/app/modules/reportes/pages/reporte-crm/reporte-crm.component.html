<ui-report
  clave="reporte-crm"
  mensajeVacio="No se ha enviado ninguna campaña todavía."
  [estado]="consulta.estado()"
  [mensajeError]="consulta.error() ?? 'No se pudo cargar el reporte.'"
  [puedeExportar]="consulta.puedeExportar()"
  [exportando]="consulta.exportando()"
  (exportar)="consulta.exportar()"
  (reintentar)="consulta.cargar()"
>
  <ui-kpi kpis etiqueta="Nuevos" [valor]="datos()?.clientes_por_segmento?.nuevo ?? null" formato="cantidad" />
  <ui-kpi kpis etiqueta="Frecuentes" [valor]="datos()?.clientes_por_segmento?.frecuente ?? null" formato="cantidad" />
  <ui-kpi kpis etiqueta="VIP" [valor]="datos()?.clientes_por_segmento?.vip ?? null" formato="cantidad" />
  <ui-kpi kpis etiqueta="Inactivos" [valor]="datos()?.clientes_por_segmento?.inactivo ?? null" formato="cantidad" />
  <div resumen>
    <ui-section titulo="Interacciones por tipo">
      <ui-tabla [columnas]="columnasInteracciones" [filas]="interacciones()" [mostrarPaginador]="false" mensajeVacio="No hay interacciones registradas todavía." />
    </ui-section>
    @if (datos(); as r) {
      <ui-section titulo="Loyalty">
        <ui-kpi etiqueta="Puntos ganados" [valor]="r.loyalty.puntos_ganados_total" formato="cantidad" />
        <ui-kpi etiqueta="Puntos canjeados" [valor]="r.loyalty.puntos_canjeados_total" formato="cantidad" />
        <ui-kpi etiqueta="Puntos vencidos" [valor]="r.loyalty.puntos_vencidos_total" formato="cantidad" />
        <ui-kpi etiqueta="Saldo actual" [valor]="r.loyalty.saldo_actual_total" formato="cantidad" />
      </ui-section>
    }
  </div>
  <div detalle>
    @if (consulta.respuesta(); as reporte) {
      <ui-section titulo="Campañas enviadas">
        <ui-tabla
          [columnas]="columnas"
          [filas]="reporte.data.detalle"
          [meta]="reporte.meta"
          [cargando]="consulta.cargando()"
          (cambio)="consulta.paginar($event)"
        />
      </ui-section>
    }
  </div>
</ui-report>
