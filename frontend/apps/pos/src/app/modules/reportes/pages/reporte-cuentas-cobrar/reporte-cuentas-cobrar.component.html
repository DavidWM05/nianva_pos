<ui-report
  clave="reporte-cuentas-cobrar"
  [estado]="consulta.estado()"
  [mensajeError]="consulta.error() ?? 'No se pudo cargar el reporte.'"
  [puedeExportar]="consulta.puedeExportar()"
  [exportando]="consulta.exportando()"
  (exportar)="consulta.exportar()"
  (reintentar)="consulta.cargar()"
>
  <ui-kpi kpis etiqueta="Saldo pendiente" [valor]="datos()?.total_pendiente ?? null" formato="dinero" />
  <ui-kpi kpis etiqueta="Saldo vencido" [valor]="datos()?.total_vencido ?? null" formato="dinero" />
  <div resumen>
    @if (datos(); as r) {
      <ui-section titulo="Antigüedad de saldos">
        <ui-tabla [columnas]="columnasAntiguedad" [filas]="[r.por_antiguedad]" [mostrarPaginador]="false" />
      </ui-section>
      <ui-section titulo="Clientes con mayor saldo pendiente">
        <ui-tabla [columnas]="columnasRanking" [filas]="r.por_cliente" [mostrarPaginador]="false" mensajeVacio="No hay cuentas por cobrar pendientes." />
      </ui-section>
    }
  </div>
  <div detalle>
    @if (consulta.respuesta(); as reporte) {
      <ui-section titulo="Detalle de cuentas por cobrar">
        <ui-tabla
          [columnas]="columnas"
          [filas]="reporte.data.detalle"
          [meta]="reporte.meta"
          [cargando]="consulta.cargando()"
          [totales]="{ saldo_pendiente: reporte.data.total_pendiente }"
          (cambio)="consulta.paginar($event)"
        />
      </ui-section>
    }
  </div>
</ui-report>
