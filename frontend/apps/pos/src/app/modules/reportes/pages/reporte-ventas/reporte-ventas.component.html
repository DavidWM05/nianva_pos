<ui-report
  clave="reporte-ventas"
  [estado]="consulta.estado()"
  [mensajeError]="consulta.error() ?? 'No se pudo cargar el reporte.'"
  [puedeExportar]="consulta.puedeExportar()"
  [exportando]="consulta.exportando()"
  (exportar)="consulta.exportar()"
  (reintentar)="consulta.cargar()"
>
  <ui-report-filtros
    filtros
    [aplicarConBoton]="true"
    [sucursales]="sucursales()"
    [puedeElegirSucursal]="puedeElegirSucursal()"
    [sucursalUsuario]="sucursalUsuario()"
    [textoSucursal]="puedeConsolidar() ? 'Todas las sucursales' : null"
    (cambio)="filtrar($event)"
  />
  <ui-kpi kpis etiqueta="Total vendido" [valor]="datos()?.totales?.vendido ?? null" formato="dinero" />
  <ui-kpi kpis etiqueta="Número de ventas" [valor]="datos()?.totales?.tickets ?? null" formato="cantidad" />
  <ui-kpi kpis etiqueta="Ticket promedio" [valor]="datos()?.totales?.ticket_promedio ?? null" formato="dinero" />
  <ui-kpi kpis etiqueta="Ventas netas comerciales" [valor]="datos()?.totales?.ventas_netas_comerciales ?? null" formato="dinero" />
  <ui-grafica-serie grafica titulo="Ventas por día" [puntos]="puntos()" />
  <div resumen>
    @if (datos(); as r) {
      <ui-section titulo="Por sucursal">
        <ui-tabla [columnas]="columnasSucursal" [filas]="r.por_sucursal" [mostrarPaginador]="false" mensajeVacio="No hay ventas en el periodo seleccionado." />
      </ui-section>
      <ui-section titulo="Por método de pago">
        <ui-tabla [columnas]="columnasPago" [filas]="r.por_metodo_pago" [mostrarPaginador]="false" mensajeVacio="No hay pagos en el periodo seleccionado." />
      </ui-section>
      <ui-section titulo="Productos más vendidos">
        <ui-tabla [columnas]="columnasProductos" [filas]="r.top_productos" [mostrarPaginador]="false" mensajeVacio="No hay productos vendidos en el periodo seleccionado." />
      </ui-section>
    }
  </div>
  <div detalle>
    @if (consulta.respuesta(); as reporte) {
      <ui-section titulo="Operaciones del periodo">
        <ui-tabla
          [columnas]="columnas"
          [filas]="reporte.data.detalle"
          [meta]="reporte.meta"
          [cargando]="consulta.cargando()"
          [totales]="{ importe_comercial: reporte.data.totales.ventas_netas_comerciales }"
          (cambio)="consulta.paginar($event)"
        />
      </ui-section>
    }
  </div>
</ui-report>
