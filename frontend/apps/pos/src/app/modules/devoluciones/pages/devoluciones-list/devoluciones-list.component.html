<ui-page-header clave="devoluciones">@if (permisos().crear) { <ui-btn-crear acciones objeto="devolución / cambio" genero="f" ruta="/devoluciones/nueva" /> }</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar [meta]="meta()"></ui-filter-bar>
  <ui-tabla [columnas]="columnas" [filas]="filas()" [meta]="meta()" [cargando]="loading()" mensajeVacio="No hay devoluciones registradas todavía." (cambio)="onCambio($event)" (accion)="verFila($event.fila)" />
</ui-page>
