<ui-page-header clave="precios" subtitulo="Detalle del cupón" />
<ui-page
  [estado]="cargando() ? 'cargando' : error() ? 'error' : 'listo'"
  forma="detalle"
  (reintentar)="cargar()"
>
  @if (cupon(); as cuponActual) {
    <h2>{{ cuponActual.codigo }}</h2>

    <nucleo-record-tabs [tabs]="tabs">
      <ng-template>
        <div class="cupon-detalle__tab">
          @if (!puedeEditar()) {
            <ui-alert tono="info"
              >No tienes permiso para editar cupones -- solo
              visualizar.</ui-alert
            >
          }
          <nucleo-cupon-form
            [valorInicial]="cuponActual"
            [readonly]="!puedeEditar()"
            submitLabel="Guardar cambios"
            (guardar)="onGuardar($event)"
          />
        </div>
      </ng-template>

      <ng-template>
        @defer (on viewport) {
          <nucleo-audit-log-viewer
            [tabla]="'cupones'"
            [registroId]="cuponActual.id"
          />
        } @placeholder {
          <p>Auditoría (se carga al hacer scroll hasta aquí)...</p>
        } @loading (minimum 200ms) {
          <ui-skeleton forma="texto" />
        }
      </ng-template>
    </nucleo-record-tabs>
  }
</ui-page>
