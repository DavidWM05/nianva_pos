<ui-section titulo="Cupones">
  @if (permisos().crear) {
    <ui-btn-crear objeto="cupón" ruta="/precios/cupones/nuevo" />
  }
</ui-section>
<ui-page [estado]="estadoPagina()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="busqueda().trim() !== ''"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #campoBuscar etiqueta="Buscar">
      <input [id]="campoBuscar.controlId()"
        #buscar
        type="search"
        placeholder="Buscar por código o nombre..."
        [ngModel]="busqueda()"
        (ngModelChange)="onBuscarInput($event)"
      />
    </ui-campo>
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    [filaInactiva]="esInactiva"
    mensajeVacio="No hay cupones que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
  />
</ui-page>
