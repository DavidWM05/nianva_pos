<nucleo-dynamic-form
  [fields]="fields"
  [submitLabel]="submitLabel"
  [readonly]="readonly"
  (formSubmit)="onSubmit($event)"
>

<div class="regla-precio-form__aplica-a">
  <ui-campo etiqueta="Aplica a" [requerido]="true">
    <ui-select-filtro
      [todas]="false"
      [opciones]="opcionesAplicaA"
      [ngModelOptions]="{ standalone: true }"
      [ngModel]="aplicaA()"
      (ngModelChange)="onCambiarAplicaA($event)"
      [disabled]="readonly"
    />
  </ui-campo>

  @if (aplicaA() === 'categoria') {
    <nucleo-entidad-selector
      [buscador]="buscadorCategoria"
      label="Categoría"
      placeholder="Buscar categoría por nombre..."
      [valorInicial]="categoriaId()"
      (seleccionado)="categoriaId.set($event)"
      [disabled]="readonly"
    />
  }

  @if (aplicaA() === 'producto') {
    <nucleo-entidad-selector
      [buscador]="buscadorProducto"
      label="Producto"
      placeholder="Buscar producto por nombre..."
      [valorInicial]="productoId()"
      (seleccionado)="productoId.set($event)"
      [disabled]="readonly"
    />
  }

  @if (aplicaA() === 'variante') {
    <nucleo-entidad-selector
      [buscador]="buscadorProducto"
      [buscadorHijos]="buscadorVarianteDeProducto"
      label="Producto"
      labelHijos="Variante"
      placeholder="Buscar producto por nombre..."
      [valorInicial]="productoId()"
      [valorInicialHijo]="varianteId()"
      (seleccionado)="productoId.set($event)"
      (hijoSeleccionado)="varianteId.set($event)"
      [disabled]="readonly"
    />
  }
</div>

</nucleo-dynamic-form>
