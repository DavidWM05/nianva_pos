<ui-page-header clave="auditoria" subtitulo="Cambios registrados en el tenant" />

<ui-page [estado]="estadoPagina()" forma="listado" (reintentar)="onFiltrar()">
  <ui-filter-bar [meta]="meta()" [hayFiltros]="hayFiltros()" (limpiar)="limpiarFiltros()">
    <ui-campo etiqueta="Tabla">
      <ui-select-filtro
        [opciones]="opcionesTablas()"
        [ngModel]="filtroTabla()"
        ariaLabel="Tabla"
        (ngModelChange)="filtroTabla.set($event); onFiltrar()"
      />
    </ui-campo>
    <ui-campo etiqueta="Usuario">
      <ui-select-filtro
        [opciones]="opcionesUsuarios()"
        [ngModel]="filtroUsuarioId()"
        ariaLabel="Usuario"
        (ngModelChange)="filtroUsuarioId.set($event); onFiltrar()"
      />
    </ui-campo>
    <ui-campo etiqueta="Desde">
      <input type="date" aria-label="Desde" [value]="filtroFechaDesde()" (change)="filtroFechaDesde.set($any($event.target).value); onFiltrar()" />
    </ui-campo>
    <ui-campo etiqueta="Hasta">
      <input type="date" aria-label="Hasta" [value]="filtroFechaHasta()" (change)="filtroFechaHasta.set($any($event.target).value); onFiltrar()" />
    </ui-campo>
  </ui-filter-bar>

  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay actividad registrada con estos filtros."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
  />
</ui-page>

<ui-modal
  [visible]="entradaSeleccionada() !== null"
  (visibleChange)="cerrarCambios()"
  titulo="Cambios registrados"
  tamano="sm"
>
  @if (entradaSeleccionada(); as entrada) {
    <ul>
      @for (cambio of entrada.cambios | keyvalue; track cambio.key) {
        <li><strong>{{ cambio.key }}</strong>: {{ cambio.value.antes ?? '—' }} → {{ cambio.value.despues ?? '—' }}</li>
      }
    </ul>
  }
</ui-modal>
