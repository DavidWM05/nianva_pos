<ui-page-header clave="gift-cards"
  ><ui-btn-crear
    acciones
    objeto="gift card"
    genero="f"
    ruta="/gift-cards/emitir"
/></ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #busqueda etiqueta="Buscar por código"
      ><input
        type="text"
        placeholder="Buscar por código..."
        [ngModel]="codigoFiltro()"
        (ngModelChange)="onCodigoInput($event)"
        [id]="busqueda.controlId()"
    /></ui-campo>
    <ui-campo etiqueta="Estado"
      ><ui-select-filtro
        [opciones]="estados"
        placeholder="Estado"
        [ngModel]="estadoFiltro()"
        (ngModelChange)="onEstadoCambio($event)"
        ariaLabel="Estado"
    /></ui-campo>
    <nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre..."
      [valorInicial]="clienteFiltroId()"
      (seleccionado)="onClienteSeleccionado($event)"
    />
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay gift cards que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="irADetalle($event.fila)"
  />
</ui-page>
