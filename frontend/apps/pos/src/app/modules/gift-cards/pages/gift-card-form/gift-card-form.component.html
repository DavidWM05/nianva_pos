<ui-page-header clave="gift-cards" subtitulo="Emitir gift card" />
<ui-page estado="listo" forma="formulario">
  <ui-section titulo="Cliente (opcional)"
    ><nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre... (dejar vacío para una gift card anónima)"
      [valorInicial]="clienteId()"
      (seleccionado)="clienteId.set($event)"
  /></ui-section>
  <ui-section titulo="Datos de la gift card">
    <ui-campo etiqueta="Monto" [requerido]="true"
      ><ui-input-dinero
        [min]="0.01"
        [ngModel]="monto()"
        (ngModelChange)="monto.set($event)"
    /></ui-campo>
    <ui-campo #campoFecha etiqueta="Fecha de expiración (opcional)"
      ><input
        [id]="campoFecha.controlId()"
        [matDatepicker]="calendario"
        [ngModel]="fechaExpiracion()"
        (ngModelChange)="fechaExpiracion.set($event)" /><mat-datepicker-toggle
        [for]="calendario" /><mat-datepicker #calendario
    /></ui-campo>
  </ui-section>
  <ui-form-actions
    ><a matButton="outlined" routerLink="/gift-cards">Volver a la lista</a
    ><ui-btn-enviar
      etiqueta="Emitir gift card"
      [enviando]="guardando()"
      [deshabilitado]="!monto() || monto()! <= 0"
      (click)="emitir()"
  /></ui-form-actions>
</ui-page>
