<ui-page-header clave="transformaciones">
  @if (permisos().crear) {
    <ui-btn-crear
      acciones
      objeto="transformación"
      genero="f"
      ruta="/produccion/transformaciones/nuevo"
    />
  }
</ui-page-header>
<ui-filter-bar [meta]="meta" [hayFiltros]="false"></ui-filter-bar>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
  ><ui-tabla
    [columnas]="columns"
    [filas]="filas()"
    [meta]="meta"
    [cargando]="loading()"
    mensajeVacio="No hay transformaciones registradas."
    (cambio)="onCambio($event)"
/></ui-page>
