<ui-page estado="listo" forma="formulario"
  ><div class="receta-form">
    <ui-page-header clave="recetas" subtitulo="Nueva receta" /><a
      matButton="text"
      routerLink="/produccion/recetas"
      >Volver a la lista</a
    >

    <ui-section titulo="Producto">
      <nucleo-entidad-selector
        [buscador]="buscadorProducto"
        [buscadorHijos]="buscadorVarianteDeProducto"
        label="Producto"
        labelHijos="Variante"
        placeholder="Buscar producto por nombre..."
        [valorInicial]="productoId()"
        (seleccionado)="productoId.set($event)"
        (hijoSeleccionado)="onVarianteSeleccionada($event)"
      />
    </ui-section>

    <ui-section titulo="Datos de la receta">
      <ui-campo #campo50l1 etiqueta="Nombre">
        <input
          matInput
          type="text"
          [id]="campo50l1.controlId() ?? 'receta-form-campo50l1'"
          maxlength="200"
          [ngModel]="nombre()"
          (ngModelChange)="nombre.set($event)"
        />
      </ui-campo>
      <ui-campo #campo50l2 etiqueta="Rendimiento (unidades por tanda)">
        <input
          matInput
          type="number"
          min="0.01"
          step="0.01"
          [id]="campo50l2.controlId() ?? 'receta-form-campo50l2'"
          [ngModel]="rendimiento()"
          (ngModelChange)="rendimiento.set($event)"
        />
      </ui-campo>
      <ui-campo #campo50l3 etiqueta="Descripción (opcional)">
        <textarea
          matInput
          [id]="campo50l3.controlId() ?? 'receta-form-campo50l3'"
          rows="2"
          [ngModel]="descripcion()"
          (ngModelChange)="descripcion.set($event)"
        ></textarea>
      </ui-campo>
      <ui-campo #campo50l4 etiqueta="Instrucciones (opcional)">
        <textarea
          matInput
          [id]="campo50l4.controlId() ?? 'receta-form-campo50l4'"
          rows="3"
          [ngModel]="instrucciones()"
          (ngModelChange)="instrucciones.set($event)"
        ></textarea>
      </ui-campo>
    </ui-section>

    <ui-section titulo="Ingredientes">
      @if (ingredientes().length > 0) {
        <ui-tabla
          [columnas]="columnasIngredientes"
          [filas]="filasIngredientes"
          [meta]="metaIngredientes"
          (cambio)="paginaIngredientes.set($event)"
          (accion)="quitarIngrediente($event.fila.indice)"
        />
      }

      <div class="receta-form__ingrediente-nuevo">
        <nucleo-entidad-selector
          [buscador]="buscadorInsumo"
          label="Insumo"
          placeholder="Buscar insumo por nombre..."
          [valorInicial]="insumoStagingId()"
          (seleccionado)="insumoStagingId.set($event)"
        />
        <ui-campo #campo50l5 etiqueta="Cantidad">
          <input
            matInput
            type="number"
            min="0.01"
            step="0.01"
            [id]="campo50l5.controlId() ?? 'receta-form-campo50l5'"
            [ngModel]="cantidadStaging()"
            (ngModelChange)="cantidadStaging.set($event)"
          />
        </ui-campo>
        <nucleo-entidad-selector
          [buscador]="buscadorUnidadMedida"
          label="Unidad"
          placeholder="Buscar unidad por nombre..."
          [valorInicial]="unidadMedidaStagingId()"
          (seleccionado)="unidadMedidaStagingId.set($event)"
        />
        <button
          matButton="text"
          type="button"
          [disabled]="
            insumoStagingId() === null ||
            unidadMedidaStagingId() === null ||
            !cantidadStaging()
          "
          (click)="agregarIngrediente()"
        >
          Agregar ingrediente
        </button>
      </div>
    </ui-section>

    <div class="receta-form__acciones">
      <ui-btn-enviar
        etiqueta="Crear receta"
        [enviando]="guardando()"
        (click)="crear()"
      />
      <a matButton="text" routerLink="/produccion/recetas">Cancelar</a>
    </div>
  </div>
</ui-page>
