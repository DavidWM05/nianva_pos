<ui-page estado="listo" forma="formulario"
  ><div class="transformacion-form">
    <ui-page-header
      clave="transformaciones"
      subtitulo="Nueva transformación"
    /><a matButton="text" routerLink="/produccion/transformaciones"
      >Volver a la lista</a
    >

    <ui-section titulo="Origen">
      <nucleo-entidad-selector
        [buscador]="buscadorProductoOrigen"
        [buscadorHijos]="buscadorVarianteOrigen"
        label="Producto"
        labelHijos="Variante"
        placeholder="Buscar producto por nombre..."
        [valorInicial]="productoOrigenId()"
        (seleccionado)="productoOrigenId.set($event)"
        (hijoSeleccionado)="varianteOrigenId.set($event)"
      />
      <ui-campo #campo50l1 etiqueta="Cantidad a consumir">
        <input
          matInput
          type="number"
          min="0.01"
          step="0.01"
          [id]="campo50l1.controlId() ?? 'transformacion-form-campo50l1'"
          [ngModel]="cantidadOrigen()"
          (ngModelChange)="cantidadOrigen.set($event)"
        />
      </ui-campo>
    </ui-section>

    <ui-section titulo="Destino">
      <nucleo-entidad-selector
        [buscador]="buscadorProductoDestino"
        [buscadorHijos]="buscadorVarianteDestino"
        label="Producto"
        labelHijos="Variante"
        placeholder="Buscar producto por nombre..."
        [valorInicial]="productoDestinoId()"
        (seleccionado)="productoDestinoId.set($event)"
        (hijoSeleccionado)="varianteDestinoId.set($event)"
      />
      <ui-campo #campo50l2 etiqueta="Cantidad a producir">
        <input
          matInput
          type="number"
          min="0.01"
          step="0.01"
          [id]="campo50l2.controlId() ?? 'transformacion-form-campo50l2'"
          [ngModel]="cantidadDestino()"
          (ngModelChange)="cantidadDestino.set($event)"
        />
      </ui-campo>
    </ui-section>

    <ui-campo #campo50l3 etiqueta="Notas (opcional)">
      <textarea
        matInput
        [id]="campo50l3.controlId() ?? 'transformacion-form-campo50l3'"
        rows="2"
        [ngModel]="notas()"
        (ngModelChange)="notas.set($event)"
      ></textarea>
    </ui-campo>

    <div class="transformacion-form__acciones">
      <ui-btn-enviar
        etiqueta="Registrar transformación"
        [enviando]="guardando()"
        (click)="crear()"
      />
    </div>
  </div>
</ui-page>
