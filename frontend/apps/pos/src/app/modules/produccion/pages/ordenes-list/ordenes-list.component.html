<ui-page-header clave="ordenes-produccion">
  @if (permisos().crear) {
    <ui-btn-crear
      acciones
      objeto="orden"
      genero="f"
      ruta="/produccion/ordenes/nuevo"
    />
  }
</ui-page-header>
<ui-filter-bar [meta]="meta" [hayFiltros]="false"></ui-filter-bar>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
  ><ui-tabla
    [columnas]="columns"
    [filas]="filas()"
    [meta]="meta"
    [cargando]="loading()"
    (accion)="onAccion($event.fila, $event.accion)"
    mensajeVacio="No hay órdenes de producción registradas."
    (cambio)="onCambio($event)"
/></ui-page>
<ui-modal
  titulo="Completar orden"
  [visible]="ordenACompletar() !== null"
  (visibleChange)="cerrarCompletar()"
>
  <p>
    Se descontará el stock de insumos (FIFO por fecha de vencimiento) y se
    incrementará el stock del producto terminado.
  </p>
  <ui-campo #campo50l4 etiqueta="Cantidad producida">
    <input
      matInput
      type="number"
      min="1"
      step="1"
      [id]="campo50l4.controlId() ?? 'ordenes-list-campo50l4'"
      [ngModel]="cantidadProducida()"
      (ngModelChange)="cantidadProducida.set($event)"
    />
  </ui-campo>
  <ui-btn-enviar
    etiqueta="Completar"
    [enviando]="completando()"
    [deshabilitado]="!cantidadProducida()"
    (click)="confirmarCompletar()"
  />
</ui-modal>
