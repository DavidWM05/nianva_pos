<ui-page-header clave="insumos">
  @if (permisos().crear) {
    <ui-btn-crear acciones objeto="insumo" ruta="/produccion/insumos/nuevo" />
  }
</ui-page-header>
<ui-filter-bar
  [meta]="meta"
  [hayFiltros]="nombreFiltro().length > 0 || stockBajoFiltro()"
  (limpiar)="limpiarFiltros()"
  ><ui-campo #buscar etiqueta="Buscar por nombre"
    ><input
      matInput
      type="text"
      placeholder="Buscar por nombre..."
      class="insumos-list__buscar"
      [id]="buscar.controlId() ?? 'insumos-list-buscar'"
      [ngModel]="nombreFiltro()"
      (ngModelChange)="onNombreInput($event)" /></ui-campo
  ><mat-checkbox
    [ngModel]="stockBajoFiltro()"
    (ngModelChange)="onStockBajoCambio($event)"
    >Solo stock bajo</mat-checkbox
  ></ui-filter-bar
>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
  ><ui-tabla
    [columnas]="columns"
    [filas]="filas()"
    [meta]="meta"
    [cargando]="loading()"
    [filaInactiva]="filaInactiva"
    mensajeVacio="No hay insumos registrados."
    (cambio)="onCambio($event)"
/></ui-page>
