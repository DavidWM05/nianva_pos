<div class="prestamo-form">
  <div class="prestamo-form__header">
    <h2>Nuevo préstamo</h2>
    <a routerLink="/prestamos">Volver a la lista</a>
  </div>

  <section class="prestamo-form__seccion">
    <ui-campo
      #campo50l3
      etiqueta="Referencia (nombre de la persona o entidad, opcional)"
    >
      <input
        matInput
        type="text"
        [id]="campo50l3.controlId() ?? 'prestamo-form-campo50l3'"
        [ngModel]="referencia()"
        (ngModelChange)="referencia.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l4 etiqueta="Monto">
      <ui-input-dinero
        [min]="0.01"
        [ngModel]="monto()"
        (ngModelChange)="monto.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l5 etiqueta="Interés % (opcional)">
      <input
        matInput
        type="number"
        min="0"
        max="100"
        step="0.01"
        [id]="campo50l5.controlId() ?? 'prestamo-form-campo50l5'"
        [ngModel]="interes()"
        (ngModelChange)="interes.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l6 etiqueta="Fecha del préstamo">
      <input
        [id]="campo50l6.controlId() ?? 'prestamo-form-campo50l6'"
        matInput
        [matDatepicker]="fecha50l1"
        [ngModel]="fechaPrestamo()"
        (ngModelChange)="fechaPrestamo.set($event)"
      /><mat-datepicker-toggle [for]="fecha50l1" /><mat-datepicker #fecha50l1 />
    </ui-campo>
    <ui-campo #campo50l7 etiqueta="Fecha de vencimiento (opcional)">
      <input
        [id]="campo50l7.controlId() ?? 'prestamo-form-campo50l7'"
        matInput
        [matDatepicker]="fecha50l2"
        [ngModel]="fechaVencimiento()"
        (ngModelChange)="fechaVencimiento.set($event)"
      /><mat-datepicker-toggle [for]="fecha50l2" /><mat-datepicker #fecha50l2 />
    </ui-campo>
    <ui-campo #campo50l8 etiqueta="Notas (opcional)">
      <textarea
        matInput
        [id]="campo50l8.controlId() ?? 'prestamo-form-campo50l8'"
        rows="2"
        [ngModel]="notas()"
        (ngModelChange)="notas.set($event)"
      ></textarea>
    </ui-campo>
  </section>

  <ui-btn-enviar
    etiqueta="Registrar préstamo"
    [enviando]="guardando()"
    [deshabilitado]="!monto() || monto()! <= 0 || !fechaPrestamo()"
    (click)="crear()"
  />
</div>
