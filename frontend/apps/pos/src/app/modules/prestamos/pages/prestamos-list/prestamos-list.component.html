<div class="prestamos-list">
  <div class="prestamos-list__header">
    <h1>Préstamos</h1>
    <ui-btn-crear objeto="préstamo" ruta="/prestamos/nuevo" />
  </div>

  <ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
    ><ui-tabla
      [columnas]="columns"
      [filas]="filas()"
      [meta]="meta"
      [cargando]="loading()"
      (accion)="onAccion($event.fila, $event.accion)"
      mensajeVacio="No hay préstamos registrados."
      (cambio)="onCambio($event)"
  /></ui-page>
</div>
