<ui-page-header
  clave="atributos"
  [subtitulo]="nuevo ? 'Nuevo atributo' : 'Detalle de atributo'"
>
  @if (!nuevo && permisos().eliminar) {
    <button acciones matButton="outlined" type="button" (click)="eliminar()">
      Eliminar atributo
    </button>
  }
</ui-page-header>
<ui-page [estado]="estado()" forma="detalle" (reintentar)="cargar()">
  @if (nuevo) {
    <nucleo-atributo-form
      submitLabel="Crear atributo"
      [readonly]="!puedeGuardar()"
      [enviando]="guardando()"
      (guardar)="guardar($event)"
    />
  } @else if (atributo(); as actual) {
    <h2>{{ actual.nombre }}</h2>
    <nucleo-record-tabs [tabs]="tabs">
      <ng-template
        ><nucleo-atributo-form
          [valorInicial]="actual"
          submitLabel="Guardar cambios"
          [readonly]="!puedeGuardar()"
          [enviando]="guardando()"
          (guardar)="guardar($event)"
      /></ng-template>
      <ng-template>
        <ui-tabla
          [columnas]="columnasValores"
          [filas]="valores()"
          (accion)="accionValor($event.fila, $event.accion.tipo)"
          mensajeVacio="Este atributo todavía no tiene valores."
        />
        @if (permisos().editar) {
          <form (ngSubmit)="guardarValor()">
            @if (editando(); as valor) {
              <p>Editar valor: {{ valor.nombre }}</p>
            }
            <ui-campo #campoValor etiqueta="Valor" [requerido]="true"
              ><input
                type="text"
                [id]="campoValor.controlId()"
                [attr.maxlength]="maxNombreValor"
                [formControl]="valorNombre"
            /></ui-campo>
            <ui-campo #campoOrden etiqueta="Orden"
              ><input
                type="number"
                min="0"
                [id]="campoOrden.controlId()"
                [formControl]="valorOrden"
            /></ui-campo>
            <ui-btn-enviar
              [etiqueta]="editando() ? 'Guardar valor' : 'Agregar valor'"
              [enviando]="enviandoValor()"
              [deshabilitado]="valorNombre.invalid || valorOrden.invalid"
            />
            @if (editando()) {
              <button matButton type="button" (click)="limpiarValor()">
                Cancelar
              </button>
            }
          </form>
        }
      </ng-template>
      <ng-template>
        @defer (on viewport) {
          <nucleo-audit-log-viewer tabla="atributos" [registroId]="actual.id" />
        } @placeholder {
          <ui-skeleton forma="bloque" />
        }
      </ng-template>
    </nucleo-record-tabs>
  }
</ui-page>
