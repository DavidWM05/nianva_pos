<ui-page-header clave="inventario">
  @if (permisos().crear) {
    <ui-btn-crear
      acciones
      objeto="producto"
      ruta="/inventario/productos/nuevo"
    />
  }
</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
  ><ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
    ><ui-campo #buscar etiqueta="Buscar por nombre"
      ><input
        type="text"
        class="productos-list__buscar"
        placeholder="Buscar por nombre..."
        [id]="buscar.controlId()"
        [ngModel]="busqueda()"
        (ngModelChange)="onBuscarInput($event)" /></ui-campo></ui-filter-bar
  ><ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    [filaInactiva]="filaInactiva"
    mensajeVacio="No hay productos que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
/></ui-page>
