<ui-page-header clave="categorias">
  @if (permisos().crear) {
    <ui-btn-crear
      acciones
      objeto="categoría"
      genero="f"
      ruta="/inventario/categorias/nuevo"
    />
  }
</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #buscador etiqueta="Buscar por nombre"
      ><input
        type="text"
        placeholder="Buscar por nombre..."
        [id]="buscador.controlId()"
        [ngModel]="busqueda()"
        (ngModelChange)="onBuscarInput($event)"
    /></ui-campo>
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="categorias()"
    [meta]="meta()"
    [cargando]="loading()"
    [filaInactiva]="filaInactiva"
    mensajeVacio="No hay categorías que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="onAccion($event.fila, $event.accion)"
  />
</ui-page>
