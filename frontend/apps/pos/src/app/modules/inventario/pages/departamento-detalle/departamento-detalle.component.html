<ui-page-header clave="departamentos" subtitulo="Detalle de departamento" />
<ui-page
  [estado]="cargando() ? 'cargando' : error() ? 'error' : 'listo'"
  forma="detalle"
  (reintentar)="reintentar()"
>
  @if (departamento(); as actual) {
    <h2>{{ actual.nombre }}</h2>
    <nucleo-record-tabs [tabs]="tabs">
      <ng-template>
        @if (!puedeEditar()) {
          <ui-alert tono="info"
            >No tienes permiso para editar departamentos -- solo
            visualizar.</ui-alert
          >
        }
        <nucleo-departamento-form
          [valorInicial]="actual"
          [readonly]="!puedeEditar()"
          [enviando]="guardando()"
          submitLabel="Guardar cambios"
          (guardar)="onGuardar($event)"
        />
      </ng-template>
      <ng-template>
        @defer (on viewport) {
          <nucleo-audit-log-viewer
            [tabla]="'departamentos'"
            [registroId]="actual.id"
          />
        } @placeholder {
          <ui-skeleton forma="bloque" />
        } @loading (minimum 200ms) {
          <ui-skeleton forma="bloque" />
        }
      </ng-template>
    </nucleo-record-tabs>
  }
</ui-page>
