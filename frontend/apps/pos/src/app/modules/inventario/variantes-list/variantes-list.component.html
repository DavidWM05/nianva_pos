@if (variantes.length === 0) {
  <ui-empty mensaje="Este producto todavía no tiene variantes." />
}
@for (variante of variantes; track variante.id) {
  <ui-section [titulo]="etiquetaVariante(variante)">
    @if (!variante.activo) {
      <ui-alert tono="info">Inactivo</ui-alert>
    }
    <button matButton="text" type="button" (click)="verKardex.emit(variante)">
      Kardex
    </button>
    @if (puedeRegistrarCompra) {
      <button
        matButton="text"
        type="button"
        (click)="registrarCompra.emit(variante)"
      >
        Registrar compra
      </button>
    }
    <ui-row-actions
      [acciones]="acciones(variante)"
      (accion)="onAccion(variante, $event)"
    />
    @if (variante.codigo_barras) {
      <p>
        Código de barras <code>{{ variante.codigo_barras }}</code>
      </p>
    }
    @if (stockBajo(variante); as aviso) {
      <ui-alert tono="peligro">Stock bajo en {{ aviso }}</ui-alert>
    }
    <ui-tabla
      [columnas]="columnasStock"
      [filas]="filasStock(variante)"
      [meta]="metaStock(variante)"
      (cambio)="cambiarStock(variante.id, $event)"
      mensajeVacio="Sin movimientos de stock registrados todavía."
    />
  </ui-section>
}
