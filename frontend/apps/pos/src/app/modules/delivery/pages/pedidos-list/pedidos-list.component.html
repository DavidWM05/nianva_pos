<div class="pedidos-list">
  <div class="pedidos-list__header">
    <h1>Pedidos</h1>
    @if (permisos().crear) {
      <ui-btn-crear objeto="pedido" ruta="/pedidos/nuevo" />
    }
  </div>

  <div class="pedidos-list__filtros">
    <input
      aria-label="Buscar por número..."
      matInput
      type="text"
      placeholder="Buscar por número..."
      class="pedidos-list__buscar"
      (input)="onNumeroInput($any($event.target).value)"
    />
    <ui-select-filtro
      [todas]="false"
      ariaLabel="Estado"
      [opciones]="estados"
      [ngModel]="estadoFiltro()"
      (ngModelChange)="onEstadoCambio($event)"
    />
    <nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre..."
      [valorInicial]="clienteFiltroId()"
      (seleccionado)="onClienteSeleccionado($event)"
    />
    <nucleo-entidad-selector
      [buscador]="buscadorRepartidor"
      label="Repartidor"
      placeholder="Buscar repartidor por nombre..."
      [valorInicial]="repartidorFiltroId()"
      (seleccionado)="onRepartidorSeleccionado($event)"
    />
  </div>

  <ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()"
    ><ui-tabla
      [columnas]="columns"
      [filas]="filas()"
      [meta]="meta"
      [cargando]="loading()"
      (accion)="onAccion($event.fila, $event.accion)"
      mensajeVacio="No hay pedidos que coincidan con la búsqueda."
      (cambio)="onCambio($event)"
  /></ui-page>
</div>
