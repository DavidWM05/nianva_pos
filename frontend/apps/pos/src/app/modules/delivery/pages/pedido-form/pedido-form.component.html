<div class="pedido-form">
  <div class="pedido-form__header">
    <h2>Nuevo pedido</h2>
    <a routerLink="/pedidos">Volver a la lista</a>
  </div>

  <section class="pedido-form__seccion">
    <h3>Cliente</h3>
    <nucleo-entidad-selector
      [buscador]="buscadorCliente"
      label="Cliente"
      placeholder="Buscar cliente por nombre..."
      [valorInicial]="clienteId()"
      (seleccionado)="clienteId.set($event)"
    />
  </section>

  <section class="pedido-form__seccion">
    <h3>Entrega</h3>
    <ui-campo #campo50l1 etiqueta="Dirección de entrega (opcional)">
      <textarea
        matInput
        [id]="campo50l1.controlId() ?? 'pedido-form-campo50l1'"
        rows="2"
        [ngModel]="direccionEntrega()"
        (ngModelChange)="direccionEntrega.set($event)"
      ></textarea>
    </ui-campo>
    <ui-campo #campo50l2 etiqueta="Referencia de la dirección (opcional)">
      <input
        matInput
        type="text"
        [id]="campo50l2.controlId() ?? 'pedido-form-campo50l2'"
        maxlength="255"
        [ngModel]="referencia()"
        (ngModelChange)="referencia.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l3 etiqueta="Costo de envío (opcional)">
      <ui-input-dinero
        [min]="0"
        [ngModel]="costoDelivery()"
        (ngModelChange)="costoDelivery.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l4 etiqueta="Tiempo estimado en minutos (opcional)">
      <input
        matInput
        type="number"
        [id]="campo50l4.controlId() ?? 'pedido-form-campo50l4'"
        min="1"
        [ngModel]="tiempoEstimado()"
        (ngModelChange)="tiempoEstimado.set($event)"
      />
    </ui-campo>
    <ui-campo #campo50l5 etiqueta="Notas (opcional)">
      <textarea
        matInput
        [id]="campo50l5.controlId() ?? 'pedido-form-campo50l5'"
        rows="2"
        [ngModel]="notas()"
        (ngModelChange)="notas.set($event)"
      ></textarea>
    </ui-campo>
  </section>

  <section class="pedido-form__seccion">
    <h3>Items (opcional)</h3>
    <nucleo-lineas-cotizacion
      [valorInicial]="null"
      (cambio)="onLineasCambio($event)"
    />
  </section>

  <div class="pedido-form__acciones">
    <ui-btn-enviar
      etiqueta="Crear pedido"
      [enviando]="guardando()"
      [deshabilitado]="clienteId() === null"
      (click)="crear()"
    />
    <a matButton="text" routerLink="/pedidos">Cancelar</a>
  </div>
</div>
