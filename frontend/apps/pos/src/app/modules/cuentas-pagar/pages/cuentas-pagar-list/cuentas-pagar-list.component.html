<ui-page-header clave="cuentas-pagar"></ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar
    [meta]="meta()"
    [hayFiltros]="hayFiltros()"
    (limpiar)="limpiarFiltros()"
  >
    <ui-campo #busqueda etiqueta="Buscar por proveedor"
      ><input
        type="text"
        placeholder="Buscar por proveedor..."
        [ngModel]="proveedorFiltro()"
        (ngModelChange)="onProveedorInput($event)"
        [id]="busqueda.controlId()"
    /></ui-campo>
    <ui-campo etiqueta="Estado"
      ><ui-select-filtro
        [opciones]="estados"
        placeholder="Estado"
        [ngModel]="estadoFiltro()"
        (ngModelChange)="onEstadoCambio($event)"
        ariaLabel="Estado"
    /></ui-campo>
  </ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay cuentas por pagar que coincidan con la búsqueda."
    (cambio)="onCambio($event)"
    (accion)="irADetalle($event.fila)"
  />
</ui-page>
