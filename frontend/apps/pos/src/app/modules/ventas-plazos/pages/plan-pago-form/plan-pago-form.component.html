<ui-page-header clave="ventas-plazos" subtitulo="Nuevo plan de pago a plazos" />
<ui-page estado="listo" forma="formulario"
  ><ui-section titulo="Plan de pago">
    <nucleo-entidad-selector
      [buscador]="buscadorVenta"
      label="Venta"
      placeholder="Buscar venta por cliente..."
      [valorInicial]="ventaId()"
      (seleccionado)="ventaId.set($event)"
    />
    <ui-campo #cuotas etiqueta="Número de cuotas (2 a 36)" [requerido]="true"
      ><input
        type="number"
        min="2"
        max="36"
        step="1"
        [id]="cuotas.controlId()"
        [ngModel]="numeroCuotas()"
        (ngModelChange)="numeroCuotas.set($event)"
    /></ui-campo>
    <ui-campo #interes etiqueta="Tasa de interés % (opcional)"
      ><input
        type="number"
        min="0"
        max="100"
        step="0.01"
        [id]="interes.controlId()"
        [ngModel]="tasaInteres()"
        (ngModelChange)="tasaInteres.set($event)"
    /></ui-campo>
    <ui-campo etiqueta="Periodicidad" [requerido]="true"
      ><ui-select-filtro
        [opciones]="periodicidades"
        [todas]="false"
        ariaLabel="Periodicidad"
        [ngModel]="periodicidad()"
        (ngModelChange)="periodicidad.set($event)"
    /></ui-campo>
    <ui-campo #fecha etiqueta="Fecha de inicio (opcional, hoy por defecto)"
      ><input
        type="date"
        [id]="fecha.controlId()"
        [ngModel]="fechaInicio()"
        (ngModelChange)="fechaInicio.set($event)"
    /></ui-campo> </ui-section
  ><ui-form-actions
    ><a matButton="outlined" routerLink="/ventas-plazos">Volver a la lista</a
    ><ui-btn-enviar
      etiqueta="Crear plan de pago"
      [enviando]="guardando()"
      [deshabilitado]="ventaId() === null || !numeroCuotas()"
      (click)="crear()" /></ui-form-actions
></ui-page>
