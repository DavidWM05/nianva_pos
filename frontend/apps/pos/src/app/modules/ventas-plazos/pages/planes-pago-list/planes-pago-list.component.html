<ui-page-header clave="ventas-plazos">
  @if (permisos().crear) {
    <ui-btn-crear acciones objeto="plan de pago" ruta="/ventas-plazos/nuevo" />
  }
</ui-page-header>
<ui-page [estado]="estado()" forma="listado" (reintentar)="reintentar()">
  <ui-filter-bar [meta]="meta()"></ui-filter-bar>
  <ui-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [meta]="meta()"
    [cargando]="loading()"
    mensajeVacio="No hay planes de pago a plazos registrados."
    (cambio)="onCambio($event)"
    (accion)="irADetalle($event.fila)"
  />
</ui-page>
