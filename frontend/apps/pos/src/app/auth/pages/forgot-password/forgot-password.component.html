<div class="auth-page">
  <div class="auth-card">
    <h1>Recuperar contraseña</h1>
    <p class="auth-card__subtitle">Te enviaremos un enlace para restablecerla.</p>

    @if (status(); as mensaje) {
      <ui-alert tono="exito" class="auth-card__aviso auth-card__status">{{ mensaje }}</ui-alert>
    }

    <nucleo-dynamic-form [fields]="fields" [enviando]="enviando()" submitLabel="Enviar enlace" (formSubmit)="onSubmit($event)" />

    <a routerLink="/login" class="auth-card__link">Volver a iniciar sesión</a>
  </div>
</div>
