<div class="auth-page">
  <div class="auth-card">
    <h1>Núcleo</h1>
    <p class="auth-card__subtitle">Inicia sesión con tu correo y contraseña.</p>

    @if (avisoInactividad()) {
      <ui-alert tono="advertencia" class="auth-card__aviso">Tu sesión se cerró por inactividad.</ui-alert>
    }

    @if (errorGeneral(); as error) {
      <ui-alert tono="peligro" class="auth-card__aviso">{{ error }}</ui-alert>
    }

    <nucleo-dynamic-form [fields]="fields" [enviando]="enviando()" submitLabel="Iniciar sesión" (formSubmit)="onSubmit($event)" />

    <a routerLink="/forgot-password" class="auth-card__link">¿Olvidaste tu contraseña?</a>
  </div>
</div>
