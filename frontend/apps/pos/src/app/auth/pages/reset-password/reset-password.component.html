<div class="auth-page">
  <div class="auth-card">
    <h1>Nueva contraseña</h1>

    @if (error(); as mensaje) {
      <p class="auth-card__error">{{ mensaje }}</p>
    }

    <nucleo-dynamic-form [fields]="fields" submitLabel="Restablecer contraseña" (formSubmit)="onSubmit($event)" />

    <a routerLink="/login" class="auth-card__link">Volver a iniciar sesión</a>
  </div>
</div>
