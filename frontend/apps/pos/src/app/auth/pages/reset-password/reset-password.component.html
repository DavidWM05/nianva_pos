<div class="auth-page">
  <div class="auth-card">
    <h1>Nueva contraseña</h1>

    @if (error(); as mensaje) {
      <ui-alert tono="peligro" class="auth-card__aviso">{{ mensaje }}</ui-alert>
    }

    <nucleo-dynamic-form [fields]="fields" [enviando]="enviando()" submitLabel="Restablecer contraseña" (formSubmit)="onSubmit($event)" />

    <a routerLink="/login" class="auth-card__link">Volver a iniciar sesión</a>
  </div>
</div>
