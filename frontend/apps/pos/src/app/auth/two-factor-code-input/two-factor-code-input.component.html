<form (submit)="onSubmit($event)">
  <ui-campo etiqueta="Código de verificación">
    <ui-input-codigo [formControl]="code" />
  </ui-campo>
  <button
    matButton="filled"
    type="submit"
    class="two-factor-code-input__submit"
    [disabled]="enviandoAhora() || !codigoCompleto()"
    [attr.aria-busy]="enviandoAhora() || null"
  >
    @if (indicadorEnvio()) {
      <i class="pi pi-spin pi-spinner" matButtonIcon aria-hidden="true"></i>
    }
    {{ submitLabel }}
  </button>
</form>
