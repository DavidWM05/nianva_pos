<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  (onHide)="cerrado.emit()"
  [header]="titulo()"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [focusOnShow]="true"
  [closeAriaLabel]="'Cerrar'"
  [styleClass]="clase()"
>
  <ng-content />

  <ng-template #footer>
    <ui-form-actions>
      <ng-content select="[acciones]" />
    </ui-form-actions>
  </ng-template>
</p-dialog>
