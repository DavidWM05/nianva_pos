<ng-template #plantilla>
  <div class="ui-modal">
    <div class="ui-modal__cabecera">
      <h2 class="ui-modal__titulo">{{ titulo() }}</h2>
      <button matIconButton type="button" class="ui-modal__cerrar" aria-label="Cerrar" (click)="cerrar()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="ui-modal__cuerpo">
      <ng-content />
    </div>

    <ui-form-actions>
      <ng-content select="[acciones]" />
    </ui-form-actions>
  </div>
</ng-template>
