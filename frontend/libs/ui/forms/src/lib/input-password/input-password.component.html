<div class="ui-input-password">
  <input
    [type]="mostrar() ? 'text' : 'password'"
    [value]="texto()"
    [disabled]="deshabilitado()"
    [autocomplete]="autocomplete()"
    [id]="idControl()"
    [attr.aria-required]="ariaRequerido() ? 'true' : null"
    [attr.aria-invalid]="ariaInvalido() ? 'true' : null"
    [attr.aria-describedby]="descritoPor()"
    (input)="alEntrar($event)"
    (blur)="alSalir()"
  />
  <button
    type="button"
    class="ui-input-password__ojo"
    [disabled]="deshabilitado()"
    [attr.aria-label]="mostrar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="mostrar()"
    [attr.title]="mostrar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    (click)="alternarVisibilidad()"
  >
    <i [class]="mostrar() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
  </button>
</div>
