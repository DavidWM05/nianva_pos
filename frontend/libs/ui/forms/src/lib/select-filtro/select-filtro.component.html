<p-select
  [id]="idControl() ?? undefined"
  [options]="opcionesConTodas()"
  optionLabel="label"
  optionValue="value"
  placeholder=""
  [ngModel]="valor()"
  [disabled]="deshabilitado()"
  [attr.aria-required]="ariaRequerido() ? 'true' : null"
  [attr.aria-invalid]="ariaInvalido() ? 'true' : null"
  [attr.aria-describedby]="descritoPor()"
  (ngModelChange)="alCambiar($event)"
  (onBlur)="tocar()"
/>
