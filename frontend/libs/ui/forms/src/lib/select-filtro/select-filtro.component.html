<mat-form-field class="ui-select-filtro__campo" appearance="outline" subscriptSizing="dynamic">
  <!-- canSelectNullableOptions: sin el, MatSelect trata null como "sin valor" y "Todas" no se
       muestra. aria-labelledby, aria-describedby y errorStateMatcher son entradas de MatSelect:
       con [attr.*] el propio MatSelect los pisaba con su estado, que no ve el control de afuera. -->
  <mat-select
    [id]="idControl() ?? ''"
    [aria-label]="etiquetaId() ? '' : (ariaLabel() ?? '')"
    [aria-labelledby]="etiquetaId() ?? ''"
    [aria-describedby]="descritoPor() ?? ''"
    [errorStateMatcher]="errorCampo"
    [canSelectNullableOptions]="true"
    placeholder=""
    [ngModel]="valor()"
    [disabled]="deshabilitado()"
    [required]="ariaRequerido()"
    (ngModelChange)="alCambiar($event)"
    (openedChange)="alCerrar($event)"
  >
    @for (opcion of opcionesConTodas(); track opcion.value) {
      <mat-option [value]="opcion.value">{{ opcion.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
