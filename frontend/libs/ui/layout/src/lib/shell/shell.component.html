<div class="ui-shell" [class.ui-shell--angosta]="angosta()">
  <div
    id="ui-shell-menu"
    class="ui-shell__menu"
    [class.ui-shell__menu--abierto]="menuAbierto()"
    [attr.aria-hidden]="angosta() && !menuAbierto() ? 'true' : null"
    [attr.inert]="angosta() && !menuAbierto() ? '' : null"
  >
    <ng-content select="[menu]" />
  </div>

  @if (angosta() && menuAbierto()) {
    <div class="ui-shell__velo" aria-hidden="true" (click)="cerrarMenu()"></div>
  }

  <div class="ui-shell__principal">
    <header class="ui-shell__encabezado">
      @if (angosta()) {
        <button
          type="button"
          class="ui-shell__abrir"
          aria-label="Abrir menú"
          aria-controls="ui-shell-menu"
          [attr.aria-expanded]="menuAbierto()"
          (click)="abrirMenu()"
        >
          <i class="pi pi-bars" aria-hidden="true"></i>
        </button>
      }
      <ng-content select="[encabezado]" />
    </header>

    <main class="ui-shell__contenido">
      <ng-content />
    </main>
  </div>
</div>
