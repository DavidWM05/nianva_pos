<div class="ui-report-filtros">
  <!-- La etiqueta va encima, como la de Sucursal y la de ui-campo; un mat-label la pondria
       flotando dentro del borde y el campo mediria 56 px. -->
  <div class="ui-report-filtros__campo" role="group" [attr.aria-labelledby]="idEtiquetaPeriodo">
    <span class="ui-report-filtros__etiqueta" [id]="idEtiquetaPeriodo">Periodo</span>
    <mat-form-field class="ui-report-filtros__fecha" appearance="outline" subscriptSizing="dynamic">
      <mat-date-range-input [formGroup]="fechas" [rangePicker]="picker" separator="–">
        <input matStartDate placeholder="YYYY-MM-DD" aria-label="Desde" />
        <input matEndDate placeholder="YYYY-MM-DD" aria-label="Hasta" />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker" aria-label="Elegir periodo" />
      <mat-date-range-picker #picker />
    </mat-form-field>
  </div>

  <div class="ui-report-filtros__campo">
    @if (puedeElegirSucursal()) {
      <span class="ui-report-filtros__etiqueta">Sucursal</span>
      <ui-select-filtro
        [opciones]="opcionesSucursales()"
        [ngModel]="sucursalId()"
        ariaLabel="Sucursal"
        (ngModelChange)="alCambiarSucursal($event)"
      />
    } @else {
      <span class="ui-report-filtros__sucursal">{{ sucursalTexto() }}</span>
    }
  </div>

  <ng-content />

  <button matButton="text" type="button" (click)="limpiarFiltros()">
    <i class="pi pi-filter-slash ui-report-filtros__icono-limpiar" matButtonIcon aria-hidden="true"></i>
    <span>Limpiar</span>
  </button>
</div>
