<div class="ui-report-filtros">
  <div class="ui-report-filtros__campo">
    <label for="ui-report-filtros-fechas">Periodo</label>
    <p-datepicker
      inputId="ui-report-filtros-fechas"
      selectionMode="range"
      [readonlyInput]="true"
      [ngModel]="rango()"
      (ngModelChange)="alCambiarFechas($event)"
    />
  </div>

  <div class="ui-report-filtros__campo">
    @if (puedeElegirSucursal()) {
      <span class="ui-report-filtros__etiqueta">Sucursal</span>
      <ui-select-filtro
        [opciones]="opcionesSucursales()"
        [ngModel]="sucursalId()"
        ariaLabel="Sucursal"
        (ngModelChange)="alCambiarSucursal($event)"
      />
    } @else {
      <span class="ui-report-filtros__sucursal">{{ sucursalTexto() }}</span>
    }
  </div>

  <ng-content />

  <button matButton="text" type="button" (click)="limpiarFiltros()">
    <i class="pi pi-filter-slash ui-report-filtros__icono-limpiar" matButtonIcon aria-hidden="true"></i>
    <span>Limpiar</span>
  </button>
</div>
