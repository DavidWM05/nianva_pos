<div class="ui-row-actions">
  @for (accion of visibles(); track accion.tipo + (accion.id ?? accion.indice)) {
    <span
      class="ui-row-actions__envoltura"
      [matTooltip]="accion.motivoDeshabilitada ?? ''"
      [matTooltipDisabled]="!accion.motivoDeshabilitada"
      matTooltipPosition="above"
    >
      <button
        matIconButton
        type="button"
        class="ui-row-actions__accion"
        [class.ui-row-actions__accion--peligro]="accion.tono === 'danger'"
        [disabled]="!!accion.motivoDeshabilitada"
        [attr.title]="aria(accion)"
        [attr.aria-label]="aria(accion)"
        (click)="ejecutar(accion)"
      >
        <i [class]="accion.icono" aria-hidden="true"></i>
      </button>
    </span>
  }

  @if (menuItems().length > 0) {
    <button
      matIconButton
      type="button"
      class="ui-row-actions__menu"
      [matMenuTriggerFor]="menu"
      title="Más acciones"
      aria-label="Más acciones"
    >
      <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
    </button>
    <mat-menu #menu="matMenu">
      @for (item of menuItems(); track item.accion.tipo + (item.accion.id ?? item.accion.indice)) {
        <button
          mat-menu-item
          type="button"
          [disabled]="item.disabled"
          [attr.title]="aria(item.accion)"
          (click)="item.command()"
        >
          <i [class]="item.icon" matMenuItemIcon aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </button>
      }
    </mat-menu>
  }
</div>
