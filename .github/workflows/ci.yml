name: CI

on:
  push:
    branches:
      - master
  pull_request:
    # labeled/unlabeled: la etiqueta pro-01-autorizado vuelve a correr la guarda de PRO-01.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, intl
          coverage: none

      - name: Obtener el directorio de cache de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            backend/vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Revisar avisos de seguridad de Composer
        run: composer audit --no-interaction --abandoned=ignore

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar formato con Pint
        run: vendor/bin/pint --test

      - name: Analizar con PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Obtener la rama base para la linea base
        if: github.event_name == 'pull_request'
        working-directory: .
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Verificar que la linea base de PHPStan no crezca
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          base_ref="${{ github.base_ref }}"

          if git show "origin/${base_ref}:backend/phpstan-baseline.neon" > /tmp/phpstan-baseline-base.neon 2>/dev/null; then
            base=$(grep -oE 'count: [0-9]+' /tmp/phpstan-baseline-base.neon | awk '{sum += $2} END {print sum + 0}')
            actual=$(grep -oE 'count: [0-9]+' backend/phpstan-baseline.neon | awk '{sum += $2} END {print sum + 0}')

            echo "Errores congelados en base: ${base}"
            echo "Errores congelados en esta rama: ${actual}"

            if [ "${actual}" -gt "${base}" ]; then
              echo "La linea base de PHPStan subio de ${base} a ${actual}."
              exit 1
            fi

            echo "OK: la linea base no subio."
          else
            echo "La rama base no tiene backend/phpstan-baseline.neon; se omite la comparacion."
          fi

      - name: Ejecutar pruebas del backend
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm 11.5.3
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Configurar Node.js 22 y cache de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias con el lockfile
        run: pnpm install --frozen-lockfile

      - name: Revisar avisos de seguridad de produccion
        run: pnpm audit --prod

      - name: Revisar avisos de seguridad altos
        run: pnpm audit --audit-level high

      - name: Revisar lint
        run: pnpm nx run-many -t lint

      - name: Compilar con tipos estrictos
        run: pnpm nx run-many -t build

      - name: Ejecutar pruebas del frontend
        run: pnpm nx run-many -t test

  escaneo-skip:
    name: Escaneo de skip sin referencia
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4
        with:
          # En un PR, HEAD es el merge de prueba y HEAD^1 la base exacta con que se armó.
          fetch-depth: 2

      - name: Buscar skip u only sin issue enlazada
        shell: bash
        run: |
          set -euo pipefail

          patron='markTestSkipped|\bit\.skip|\bdescribe\.skip|\btest\.skip|\bit\.only|\bdescribe\.only|\btest\.only|\bxit\('

          coincidencias=$(
            {
              grep -rnE "$patron" backend/tests --include='*.php' || true
              grep -rnE "$patron" frontend --include='*.spec.ts' \
                --exclude-dir=node_modules \
                --exclude-dir=.nx \
                --exclude-dir=dist \
                --exclude-dir=.angular || true
            }
          )

          if [ -z "$coincidencias" ]; then
            echo "Sin skips ni only en las suites."
            exit 0
          fi

          infracciones=$(printf '%s\n' "$coincidencias" | grep -vE 'issue:[[:space:]]*[A-Za-z0-9._#/-]+' || true)

          if [ -n "$infracciones" ]; then
            echo "Se encontraron skip u only sin referencia 'issue:' en la misma linea:"
            printf '%s\n' "$infracciones"
            exit 1
          fi

          echo "Todos los skips u only tienen una referencia 'issue:' en la misma linea."

      - name: Buscar nombres internos viejos
        shell: bash
        run: |
          set -euo pipefail

          patron="$(printf '@%s/|@%s/|nucleo-%s' nucleo org shell)"

          coincidencias=$(
            {
              grep -rnE "$patron" frontend/apps frontend/libs \
                --exclude-dir=node_modules \
                --exclude-dir=.nx \
                --exclude-dir=dist \
                --exclude-dir=.angular || true
              grep -nE "$patron" frontend/*.json backend/composer.json \
                .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true
            }
          )

          if [ -n "$coincidencias" ]; then
            echo "Se encontraron nombres internos viejos:"
            printf '%s\n' "$coincidencias"
            exit 1
          fi

          echo "OK: no quedan nombres internos viejos."

      - name: Verificar que no bajen los metodos de test
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PRO01_AUTORIZADO: ${{ contains(github.event.pull_request.labels.*.name, 'pro-01-autorizado') }}
        run: |
          set -euo pipefail

          base="HEAD^1"

          contar_backend() {
            awk '
              /^[[:space:]]*public[[:space:]]+function[[:space:]]+test_/ { total++ }
              /^[[:space:]]*#\[Test\]/ { total++ }
              END { print total + 0 }
            '
          }

          contar_frontend() {
            awk '
              /^[[:space:]]*(it|test)\(/ { total++ }
              END { print total + 0 }
            '
          }

          es_test_backend() {
            case "$1" in
              backend/tests/*.php) return 0 ;;
            esac
            return 1
          }

          es_test_frontend() {
            case "$1" in
              frontend/apps/*.spec.ts|frontend/libs/*.spec.ts) return 0 ;;
            esac
            return 1
          }

          contar_base() {
            local ruta="$1"
            if es_test_backend "$ruta"; then
              git show "${base}:${ruta}" | contar_backend
            elif es_test_frontend "$ruta"; then
              git show "${base}:${ruta}" | contar_frontend
            else
              echo 0
            fi
          }

          contar_actual() {
            local ruta="$1"
            if [ ! -f "$ruta" ]; then
              echo 0
            elif es_test_backend "$ruta"; then
              contar_backend < "$ruta"
            elif es_test_frontend "$ruta"; then
              contar_frontend < "$ruta"
            else
              echo 0
            fi
          }

          perdidas=""

          while IFS=$'\t' read -r estado ruta1 ruta2; do
            [ -z "${estado:-}" ] && continue

            case "$estado" in
              A) continue ;;
              D) old="$ruta1"; new="" ;;
              R*) old="$ruta1"; new="$ruta2" ;;
              *) old="$ruta1"; new="$ruta1" ;;
            esac

            if es_test_backend "$old" || es_test_frontend "$old"; then
              if [ -z "$new" ] || { ! es_test_backend "$new" && ! es_test_frontend "$new"; }; then
                perdidas+="${old} -> eliminado o convertido en no-test"$'\n'
                continue
              fi

              antes=$(contar_base "$old")
              despues=$(contar_actual "$new")

              if [ "$despues" -lt "$antes" ]; then
                perdidas+="${old} -> ${new}: ${antes} -> ${despues}"$'\n'
              fi
            fi
          done < <(git diff --name-status -M "$base" HEAD -- backend/tests frontend/apps frontend/libs)

          if [ -n "$perdidas" ]; then
            echo "Archivos de test con menos metodos:"
            printf '%s' "$perdidas"

            if [ "${PRO01_AUTORIZADO:-false}" = "true" ]; then
              echo "AVISO: perdida autorizada por la etiqueta pro-01-autorizado."
              exit 0
            fi

            exit 1
          fi

          echo "OK: ningun archivo de test perdio metodos."

      - name: Revisar codificacion de archivos de texto
        shell: bash
        run: |
          set -euo pipefail

          hallazgos=""

          es_binaria() {
            case "$1" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.svg|*.woff|*.woff2|*.ttf|*.otf|*.eot|*.pdf|*.zip|*.gz|*.tgz|*.mp4|*.mov|*.mp3|*.wav) return 0 ;;
            esac
            return 1
          }

          while IFS= read -r -d '' ruta; do
            if es_binaria "$ruta"; then
              continue
            fi

            if ! LC_ALL=C tr -d '\000' < "$ruta" | cmp -s - "$ruta"; then
              continue
            fi

            if ! iconv -f UTF-8 -t UTF-8 "$ruta" >/dev/null 2>&1; then
              hallazgos+="UTF-8 invalido: ${ruta}"$'\n'
              continue
            fi

            if [ "$(head -c 3 "$ruta" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              hallazgos+="BOM UTF-8: ${ruta}"$'\n'
            fi

            if LC_ALL=C grep -qF $'\xef\xbf\xbd' "$ruta"; then
              hallazgos+="U+FFFD: ${ruta}"$'\n'
            fi

            while IFS=: read -r linea _; do
              hallazgos+="??+letra: ${ruta}:${linea}"$'\n'
            done < <(LC_ALL=C grep -nE '\?\?[[:alpha:]]' "$ruta" || true)
          done < <(git ls-files -z -- backend/app backend/config backend/routes backend/database backend/tests frontend/apps frontend/libs docs/estandares)

          if [ -n "$hallazgos" ]; then
            echo "Hallazgos de codificacion:"
            printf '%s' "$hallazgos"
            exit 1
          fi

          echo "OK: archivos de texto con UTF-8 valido, sin BOM, U+FFFD ni ??+letra."
